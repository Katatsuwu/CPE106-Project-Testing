<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cardinal Queue — Kiosk</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css?v=cardinal-queue-ui-6">
  <script>
    const authParams = new URLSearchParams(location.hash.slice(1));
    const authQuery = new URLSearchParams(location.search);
    const authType = authParams.get("type") || authQuery.get("type");
    if (authType === "recovery" || authType === "invite" || authQuery.has("code")) {
      location.replace(`staff-setup.html${location.search}${location.hash}`);
    }
  </script>
</head>
<body class="kiosk-page">
  <main class="screen">
    <section id="homeView" class="view active">
      <img class="main-logo" src="assets/logo.png" alt="Cardinal Queue">
      <h1>Select a service</h1>

      <div class="service-list">
        <button class="service-btn" data-service="Enrollment">ENROLLMENT</button>
        <button class="service-btn" data-service="Form 137">FORM 137</button>
        <button class="service-btn" data-service="SF9">SF9</button>
        <button class="service-btn" data-service="Other">OTHER</button>
      </div>
    </section>

    <section id="formView" class="view">
      <header class="mini-header">
        <img src="assets/logo.png" alt="Cardinal Queue">
        <button id="returnBtn" class="return-btn">RETURN</button>
      </header>

      <div class="form-wrap">
        <h2>Queuing Form</h2>
        <form id="queueForm">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text"
                 placeholder="e.g. Juan T. Dela Cruz" autocomplete="name" required>

          <label for="education">Educational Level</label>
          <select id="education" name="education" required>
            <option value="" disabled selected>Select an option</option>
            <option>Senior High School</option>
            <option>Undergraduate</option>
            <option>Graduate Studies</option>
            <option>Faculty / Staff</option>
            <option>Visitor</option>
          </select>

          <label for="email">Email</label>
          <input id="email" name="email" type="email"
                 placeholder="e.g. juandelacruz@gmail.com" autocomplete="email" required>

          <button class="submit-btn" type="submit">SUBMIT</button>
        </form>
      </div>
    </section>

    <section id="ticketView" class="view">
      <header class="mini-header">
        <img src="assets/logo.png" alt="Cardinal Queue">
        <button id="ticketReturnBtn" class="return-btn">RETURN</button>
      </header>

      <div class="ticket-card">
        <p class="ticket-label">YOUR QUEUE NUMBER</p>
        <div id="ticketNumber" class="ticket-number">A001</div>
        <p id="ticketService" class="ticket-service">ENROLLMENT</p>

        <div class="ticket-info">
          <div><span>Status</span><strong>WAITING</strong></div>
          <div><span>Service window</span><strong id="ticketWindow">—</strong></div>
        </div>
        <div id="ticketQr" class="ticket-qr" aria-label="QR code to monitor this queue">
          <a href="queue.html" aria-label="Open the live queue monitor">
            <img src="assets/queue_qr.png" alt="Scan to open the Cardinal Queue monitor">
          </a>
        </div>
        <p id="ticketMessage" class="ticket-note" role="status"></p>
        <p class="ticket-note ticket-qr-caption">Scan the QR code to view the live queue.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js" defer></script>
  <script type="module" src="js/kiosk.js"></script>
</body>
</html>
