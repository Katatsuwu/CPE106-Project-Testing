<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardinal Queue — Queue Monitor</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css?v=cardinal-queue-ui-4">
</head>
<body class="queue-page">
  <main class="queue-screen">
    <header class="queue-header">
      <img src="assets/logo.png" alt="Cardinal Queue">
      <div class="live-pill"><span></span> LIVE</div>
    </header>

    <section class="now-serving">
      <div class="serving-current">
        <p>NOW SERVING</p>
        <div id="nowServing">—</div>
        <span id="windowLabel">No queue is being served</span>
      </div>
      <div class="serving-next">
        <h2>ALSO SERVING</h2>
        <div id="servingList" class="serving-list" aria-live="polite"></div>
      </div>
    </section>

    <section class="queue-columns">
      <div class="queue-panel">
        <h2>WAITING</h2>
        <div id="waitingList" class="waiting-list"></div>
      </div>

      <div class="queue-panel user-panel">
        <h2>CHECK YOUR QUEUE</h2>
        <div class="check-row">
          <input id="queueLookup" placeholder="Queue number" autocomplete="off">
          <input id="queueCode" placeholder="Ticket code" autocomplete="off" aria-label="Private ticket code from your ticket">
          <button id="checkBtn">CHECK</button>
        </div>
        <div id="lookupResult" class="lookup-result">Enter your queue number to see your status.</div>
      </div>
    </section>

    <section class="service-summary" aria-label="Waiting by service">
      <article class="service-enrollment"><span>ENROLLMENT WAITING</span><strong id="countEnrollment">0</strong></article>
      <article class="service-payment"><span>PAYMENT WAITING</span><strong id="countPayment">0</strong></article>
      <article class="service-forms"><span>FORMS WAITING</span><strong id="countForms">0</strong></article>
    </section>
    <footer class="queue-footer">Please wait for your queue number to appear, then proceed to the assigned service window.</footer>
  </main>
  <script type="module" src="js/queue.js"></script>
</body>
</html>
